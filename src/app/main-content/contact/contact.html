<section class="contact" id="contact">
  <div class="contact-content">
    <div class="contact-headline-row">
      <h2 class="contact-headline">{{ 'contact.headline' | translate }}</h2>
      <img class="contact-arrow" src="./assets/icons/arrows/arrow-contact.svg" alt="" />
    </div>
    <div class="contact-columns">
      <p class="contact-text">{{ 'contact.text' | translate }}</p>
      <div class="contact-info">
        <a class="contact-link" href="mailto:danabas285@gmail.com">
          <img class="contact-icon" src="./assets/icons/contact/email.svg" alt="" />
          <span>{{ 'contact.email' | translate }} danabas285&#64;gmail.com</span>
        </a>
        <a class="contact-link" href="tel:+4917642011407">
          <img class="contact-icon" src="./assets/icons/contact/phone.svg" alt="" />
          <span>{{ 'contact.phone' | translate }} 0176 420 114 07</span>
        </a>
      </div>
    </div>
    <form class="contact-form" [formGroup]="contactForm" (ngSubmit)="onSubmit()">
      <div class="form-fields">
        <input
          class="form-input"
          formControlName="name"
          type="text"
          autocomplete="name"
          [placeholder]="'contact.namePlaceholder' | translate"
        />
        <input
          class="form-input"
          formControlName="email"
          type="email"
          autocomplete="email"
          [placeholder]="'contact.emailPlaceholder' | translate"
        />
        <textarea
          class="form-input form-message"
          formControlName="message"
          [placeholder]="'contact.messagePlaceholder' | translate"
        ></textarea>
      </div>
      <div class="form-bottom">
        <div class="privacy">
          <input id="privacy" class="privacy-checkbox" type="checkbox" formControlName="privacy" />
          <label class="privacy-text" for="privacy">
            {{ 'contact.privacyBefore' | translate }}
            <span class="privacy-link">{{ 'contact.privacyLink' | translate }}</span>
            {{ 'contact.privacyAfter' | translate }}
          </label>
        </div>
        <button class="btn-secondary form-button" type="submit">
          {{ 'contact.send' | translate }}
        </button>
      </div>
    </form>
  </div>
</section>
