<section class="why-me" id="why-me">
  <div class="why-me-content">
    <img class="why-me-photo" src="./assets/img/why-me-photo.jpg" alt="Tayfun Danabas" />
    <div class="why-me-info">
      <h2 class="why-me-headline">{{ 'whyMe.headline' | translate }}</h2>
      <p class="why-me-text">{{ 'whyMe.text' | translate }}</p>
      <div class="why-me-details">
        <span class="details-title">{{ 'whyMe.iAm' | translate }}</span>
        <ul>
          <li class="detail detail-location">
            <div class="detail-icon">
              <img
                class="location-pin"
                src="./assets/icons/why-me/location.svg"
                width="34"
                height="41"
                alt=""
              />
              <img
                class="icon-hover"
                src="./assets/icons/why-me/location-shadow.svg"
                width="22"
                height="9"
                alt=""
              />
            </div>
            <span class="detail-text">{{ 'whyMe.location' | translate }}</span>
          </li>
          <li class="detail detail-relocate">
            <div class="detail-icon">
              <img
                class="icon-default"
                src="./assets/icons/why-me/relocate.svg"
                width="30"
                height="49"
                alt=""
              />
              <img
                class="icon-hover"
                src="./assets/icons/why-me/relocate-hover.svg"
                width="36"
                height="53"
                alt=""
              />
            </div>
            <span class="detail-text">{{ 'whyMe.relocate' | translate }}</span>
          </li>
          <li class="detail detail-remote">
            <div class="detail-icon">
              <img
                class="icon-default"
                src="./assets/icons/why-me/remote.svg"
                width="48"
                height="41"
                alt=""
              />
              <img
                class="icon-hover"
                src="./assets/icons/why-me/remote-hover.svg"
                width="54"
                height="46"
                alt=""
              />
            </div>
            <span class="detail-text">{{ 'whyMe.remote' | translate }}</span>
          </li>
        </ul>
        <img
          class="details-arrow arrow-location"
          src="./assets/icons/arrows/arrow-why-me-1.svg"
          width="26"
          height="59"
          alt=""
        />
        <img
          class="details-arrow arrow-remote"
          src="./assets/icons/arrows/arrow-why-me-2.svg"
          width="34"
          height="43"
          alt=""
        />
        <img
          class="details-arrow arrow-button"
          src="./assets/icons/arrows/arrow-why-me-3.svg"
          width="35"
          height="59"
          alt=""
        />
        <img
          class="details-arrow arrow-mobile"
          src="./assets/icons/arrows/arrow-why-me-mobile.svg"
          width="27"
          height="51"
          alt=""
        />
      </div>
      <a class="btn-primary why-me-button" href="#contact">{{ 'whyMe.button' | translate }}</a>
    </div>
  </div>
</section>
