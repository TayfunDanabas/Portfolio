<section class="hero" id="hero">
  <div class="hero-content">
    <div class="hero-text">
      <p class="hero-job">Fullstack Developer</p>
      <h1 class="hero-name">Tayfun Danabas</h1>
    </div>
    <img class="hero-photo" src="./assets/img/hero-photo.png" alt="Tayfun Danabas" />
    <a class="hero-contact" href="#contact">{{ 'hero.contact' | translate }}</a>
    <a class="hero-arrow" href="#why-me" [attr.aria-label]="'hero.scrollDown' | translate">
      <img class="arrow-default" src="./assets/icons/arrows/arrow-down.svg" alt="" />
      <img class="arrow-hover" src="./assets/icons/arrows/arrow-down-hover.svg" alt="" />
    </a>
  </div>
</section>
