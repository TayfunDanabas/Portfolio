<header class="header">
  <div class="header-content">
    <div class="menu">
      <span class="logo">&lt;TD&gt;</span>
      <nav class="nav">
        @for (item of navItems; track item.link) {
          <a class="nav-link" [href]="item.link">{{ item.label | translate }}</a>
        }
      </nav>
    </div>

    <div class="language">
      <button class="language-button" (click)="switchLanguage('de')">DE</button>
      <span class="language-separator">|</span>
      <button class="language-button" (click)="switchLanguage('en')">EN</button>
    </div>

    <button class="burger" [attr.aria-label]="'nav.openMenu' | translate">
      <span class="burger-line"></span>
      <span class="burger-line"></span>
      <span class="burger-line"></span>
    </button>
  </div>
</header>
