<header class="header" (window:scroll)="onScroll()">
  <div class="header-content">
    <div class="menu">
      <a class="logo" routerLink="/" (click)="closeMenu()">&lt;TD&gt;</a>
      <nav class="nav">
        @for (item of navItems; track item.fragment) {
          <a
            class="nav-link"
            [class.active]="activeSection === item.fragment"
            routerLink="/"
            [fragment]="item.fragment"
          >
            {{ item.label | translate }}
          </a>
        }
      </nav>
    </div>

    <div class="language">
      <button class="language-button" (click)="switchLanguage('de')">DE</button>
      <span class="language-separator">|</span>
      <button class="language-button" (click)="switchLanguage('en')">EN</button>
    </div>

    <button
      class="burger"
      [class.open]="isMenuOpen"
      [attr.aria-label]="(isMenuOpen ? 'nav.closeMenu' : 'nav.openMenu') | translate"
      [attr.aria-expanded]="isMenuOpen"
      (click)="toggleMenu()"
    >
      <span class="burger-line"></span>
      <span class="burger-line"></span>
      <span class="burger-line"></span>
    </button>
  </div>

  <div class="mobile-menu" [class.open]="isMenuOpen">
    <nav class="mobile-nav">
      @for (item of navItems; track item.fragment) {
        <a class="mobile-nav-link" routerLink="/" [fragment]="item.fragment" (click)="closeMenu()">
          {{ item.label | translate }}
        </a>
      }
    </nav>

    <div class="mobile-language">
      <button class="language-button" (click)="switchLanguage('de')">DE</button>
      <span class="language-separator">|</span>
      <button class="language-button" (click)="switchLanguage('en')">EN</button>
    </div>
  </div>
</header>
