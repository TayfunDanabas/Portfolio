<footer class="footer">
  <div class="footer-content">
    <div class="footer-logo">
      <span class="logo">&lt;TD&gt;</span>
      <span class="logo-subtitle">Fullstack Developer</span>
    </div>
    <p class="copyright">&copy; Tayfun Danabas {{ year }}</p>
    <div class="social">
      <a
        class="social-link"
        href="https://github.com/TayfunDanabas"
        target="_blank"
        rel="noopener"
        aria-label="GitHub"
      >
        <img
          class="icon-default"
          src="./assets/icons/social/github.svg"
          width="30"
          height="30"
          alt=""
        />
        <img
          class="icon-hover"
          src="./assets/icons/social/github-hover.svg"
          width="30"
          height="30"
          alt=""
        />
      </a>
      <a class="social-link" href="mailto:danabas285@gmail.com" aria-label="E-Mail">
        <img
          class="icon-default"
          src="./assets/icons/social/email.svg"
          width="30"
          height="30"
          alt=""
        />
        <img
          class="icon-hover"
          src="./assets/icons/social/email-hover.svg"
          width="30"
          height="30"
          alt=""
        />
      </a>
      @if (linkedInUrl) {
        <a
          class="social-link"
          [href]="linkedInUrl"
          target="_blank"
          rel="noopener"
          aria-label="LinkedIn"
        >
          <img
            class="icon-default"
            src="./assets/icons/social/linkedin.svg"
            width="30"
            height="30"
            alt=""
          />
          <img
            class="icon-hover"
            src="./assets/icons/social/linkedin-hover.svg"
            width="30"
            height="30"
            alt=""
          />
        </a>
      }
    </div>
  </div>
  <nav class="footer-links">
    <a class="footer-link" routerLink="/impressum" routerLinkActive="active">
      {{ 'footer.legalNotice' | translate }}
    </a>
    <a class="footer-link" routerLink="/datenschutz" routerLinkActive="active">
      {{ 'footer.privacyPolicy' | translate }}
    </a>
  </nav>
</footer>
